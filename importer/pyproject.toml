[project]
name = "mentormap-importer"
version = "0.1.0"
description = "Mentor Map: Excel programlarını Supabase veritabanına aktarır"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "pyyaml>=6", "psycopg[binary]>=3.1", "python-dotenv>=1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
