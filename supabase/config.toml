# Supabase CLI proje ayarları (yalnızca bu projeye özgü olanlar).
project_id = "mentor-map"

[auth]
# Giriş yalnızca kisiler tablosundaki aktif e-postalara açık: hesap ilk girişte açılır,
# "before user created" kancası (public.kayit_kontrol) listede olmayanı reddeder.
enable_signup = true
site_url = "https://mentor-map.example.workers.dev"  # canlı uygulamanın adresiyle değiştirin

[auth.email]
enable_signup = true
otp_length = 6
otp_expiry = 600

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/kayit_kontrol"

# Takvim uygulamaları JWT gönderemez; koruma kişiye özel token'dan gelir.
[functions.ics]
verify_jwt = false

# Google Sheets şablonundaki Apps Script çağırır; koruma X-Mentormap-Anahtar başlığından gelir.
[functions.sheets-senkron]
verify_jwt = false
